<div class="main-container">
  <div class="actions-button-container">
    <button mat-icon-button (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="form-fields-container">
    <mat-form-field>
      <input
        matInput
        placeholder="Search"
        #inputRef
        (change)="applyFilter(inputRef.value)"
      />
    </mat-form-field>
  </div>
</div>

<mat-table class="full-width-table" [dataSource]="dataSource">

  <!-- Release Column -->
  <ng-container matColumnDef="release">
    <th
      mat-header-cell
      *matHeaderCellDef
      fxFlex="25%"
      class="centered-title"
    >
      Release
    </th>

    <td
      mat-cell
      *matCellDef="let element"
      fxFlex="25%"
      class="custom-cell"
      (click)="startEdit(element)"
    >
      {{ element.release }}
    </td>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="date">
    <th
      mat-header-cell
      *matHeaderCellDef
      fxFlex="25%"
      class="centered-title"
    >
      Date
    </th>

    <td
      mat-cell
      *matCellDef="let element"
      fxFlex="25%"
      class="custom-cell"
      (click)="startEdit(element)"
    >
      {{ element.date | date:'MM/dd/yyyy' }}
    </td>
  </ng-container>

  <!-- Notes Column -->
  <ng-container matColumnDef="notes">
    <th
      mat-header-cell
      *matHeaderCellDef
      fxFlex="40%"
      class="centered-title"
    >
      Notes
    </th>

    <td
      mat-cell
      *matCellDef="let element"
      fxFlex="40%"
      class="custom-cell"
      (click)="startEdit(element)"
    >
      {{ element.notes }}
    </td>
  </ng-container>

  <!-- Edit Column-->
  <ng-container matColumnDef="edit">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="centered-title"
      fxFlex="5%"
    ></th>

    <td mat-cell *matCellDef="let element" fxFlex="5%">
      <button
        mat-icon-button
        (click)="openEditDialog(element)"
      >
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Delete Column -->
  <ng-container matColumnDef="delete">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="centered-title"
      fxFlex="10%"
    ></th>

    <td
      mat-cell
      *matCellDef="let element"
      fxFlex="10%"
    >
      <button
        mat-icon-button
        (click)="deleteItem($event, element)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Header -->
  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
    class="custom-row"
  ></tr>

  <!-- Rows -->
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
  ></tr>

</mat-table>

<mat-paginator
  #paginator
  [length]="releases.length"
  [pageIndex]="0"
  [pageSize]="50"
  showFirstLastButtons
>
</mat-paginator>
